<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a7d3b">
<title>سوق موريتاني</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;margin:0;background:#f4f4f4}
header{background:#0a7d3b;color:#fff;padding:14px;text-align:center}
header h1{margin:0 0 10px;font-size:20px}
.langs button{background:#fff;color:#0a7d3b;border:0;padding:6px 12px;border-radius:6px;margin:0 3px;font-weight:bold}
.tools{padding:12px}
#search{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.cats{margin-top:10px;overflow-x:auto;white-space:nowrap}
.cats button{border:1px solid #0a7d3b;background:#fff;color:#0a7d3b;padding:6px 14px;border-radius:20px;margin:0 3px}
.cats button.on{background:#0a7d3b;color:#fff}
.item{background:#fff;margin:12px;padding:14px;border-radius:10px}
.item h3{margin:0 0 6px}
.price{color:#0a7d3b;font-weight:bold}
a.btn{display:inline-block;margin-top:10px;background:#25d366;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<header>
<h1 id="title"></h1>
<div class="langs">
<button onclick="setLang('ar')">العربية</button>
<button onclick="setLang('fr')">Français</button>
<button onclick="setLang('en')">English</button>
</div>
</header>
<div class="tools">
<input id="search" oninput="render()">
<div class="cats" id="cats"></div>
</div>
<div id="list"></div>

<script>
const T={
ar:{title:"سوق موريتاني محلي",search:"ابحث عن منتج...",all:"الكل",contact:"تواصل عبر واتساب",cur:"أوقية",none:"لا توجد نتائج",cats:{phones:"هواتف",clothes:"ملابس",other:"أخرى"}},
fr:{title:"Marché local mauritanien",search:"Rechercher un produit...",all:"Tout",contact:"Contacter sur WhatsApp",cur:"MRU",none:"Aucun résultat",cats:{phones:"Téléphones",clothes:"Vêtements",other:"Autres"}},
en:{title:"Mauritanian Local Market",search:"Search a product...",all:"All",contact:"Contact on WhatsApp",cur:"MRU",none:"No results",cats:{phones:"Phones",clothes:"Clothes",other:"Other"}}
};

// قائمة المنتجات: لإضافة منتج انسخ كتلة بين { } وضع فاصلة بعدها
const products=[
{
name:{ar:"هاتف مستعمل",fr:"Téléphone d'occasion",en:"Used phone"},
desc:{ar:"حالة جيدة",fr:"Bon état",en:"Good condition"},
price:8000,cat:"phones",phone:"22244241210"
},
{
name:{ar:"مجموعة سراويل",fr:"Lot de pantalons",en:"Pants set"},
desc:{ar:"حالة جيدة",fr:"Bon état",en:"Good condition"},
price:1500,cat:"clothes",phone:"22244241210"
}
];

let lang="ar",cat="all";
try{lang=localStorage.getItem("lang")||"ar"}catch(e){}

function render(){
const t=T[lang];
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.getElementById("title").textContent=t.title;
const s=document.getElementById("search");
s.placeholder=t.search;
const q=s.value.toLowerCase();
const cats=["all",...Object.keys(t.cats)];
document.getElementById("cats").innerHTML=cats.map(c=>
`<button class="${c===cat?"on":""}" onclick="setCat('${c}')">${c==="all"?t.all:t.cats[c]}</button>`).join("");
const list=products.filter(p=>(cat==="all"||p.cat===cat)&&(p.name[lang]+" "+p.desc[lang]).toLowerCase().includes(q));
document.getElementById("list").innerHTML=list.length?list.map(p=>
`<div class="item"><h3>${p.name[lang]}</h3><p>${p.desc[lang]}</p><div class="price">${p.price} ${t.cur}</div><a class="btn" href="https://wa.me/${p.phone}">${t.contact}</a></div>`).join(""):`<p style="text-align:center">${t.none}</p>`;
}
function setCat(c){cat=c;render()}
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}render()}
render();
</script>
</body>
  </html>

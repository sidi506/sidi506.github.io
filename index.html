<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a7d3b">
<title>سوق موريتاني</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;margin:0;background:#f4f4f4}
header{background:#0a7d3b;color:#fff;padding:14px;text-align:center}
header h1{margin:0 0 10px;font-size:20px}
.bar{margin-top:8px}
.bar button{background:#fff;color:#0a7d3b;border:0;padding:6px 12px;border-radius:6px;margin:0 3px;font-weight:bold}
.tools{padding:12px}
#search,#city{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:#fff}
#city{margin-top:8px}
.cats{margin-top:10px;overflow-x:auto;white-space:nowrap}
.cats button{border:1px solid #0a7d3b;background:#fff;color:#0a7d3b;padding:6px 14px;border-radius:20px;margin:0 3px}
.cats button.on{background:#0a7d3b;color:#fff}
.item{background:#fff;margin:12px;padding:14px;border-radius:10px}
.item img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#ddd}
.item h3{margin:0 0 6px}
.place{color:#555;font-size:14px;margin:6px 0}
.price{color:#0a7d3b;font-weight:bold}
a.btn{display:inline-block;margin:10px 4px 0 0;background:#25d366;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none}
a.map{background:#1a73e8}
.del{margin:10px 4px 0 0;background:#b00020;color:#fff;border:0;padding:10px 16px;border-radius:8px}
.msg{text-align:center;padding:20px}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:10;overflow:auto}
.box{background:#fff;margin:40px 12px;padding:16px;border-radius:12px;position:relative}
.box input,.box select,.box textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.box button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#0a7d3b;color:#fff;font-size:16px}
.box button.alt{background:#555}
.box button.x{position:absolute;top:6px;left:6px;width:auto;background:none;color:#000;font-size:20px;margin:0}
.note{color:#b00020;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<header>
<h1 id="title"></h1>
<div class="bar">
<button onclick="setLang('ar')">العربية</button>
<button onclick="setLang('fr')">Français</button>
<button onclick="setLang('en')">English</button>
</div>
<div class="bar" id="acct"></div>
</header>
<div class="tools">
<input id="search" oninput="render()">
<select id="city" onchange="setCity(this.value)"></select>
<div class="cats" id="cats"></div>
</div>
<div id="list"></div>
<div id="modal"><div class="box"><button class="x" onclick="closeModal()">✕</button><div id="modalbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>

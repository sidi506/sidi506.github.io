<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="splash.js"></script>
  <script src="edit.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a7d3b">
<title>سوق موريتاني</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;margin:0;background:#f1f5f2;color:#1b2b21;line-height:1.5}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}



header{
  position:relative;
  background:
    radial-gradient(circle at 15% 20%,rgba(214,173,75,.18),transparent 35%),
    linear-gradient(145deg,#052f20,#075b35 60%,#087b43);
  color:#fff;
  padding:20px 16px 34px;
  text-align:center;
  border-radius:0 0 24px 24px;
  border-bottom:3px solid #d6ad4b;
  box-shadow:0 6px 20px rgba(5,47,32,.18);
  min-height:115px;
}
  .top-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  direction:rtl;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand-icon{
  font-size:27px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.header-icon{
  background:rgba(255,255,255,.13);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  width:38px;
  height:38px;
  font-size:17px;
  padding:0;
}

.header-actions .moreBtn{
  width:38px;
  height:38px;
  padding:0;
  border-radius:12px;
}
  .brand h1{
  font-size:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-actions .moreBtn{
  background:#f2b705;
  color:#07672f;
  border:0;
  font-size:22px;
  line-height:1;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  margin:0;
}
  
  
header h1{
  margin:0;
  font-size:21px;
  font-weight:800;
}

header h1::after{
  display:none;
}

.bar{
  margin-top:10px;
}

.bar button{
  background:#fff;
  color:#0a7d3b;
  border:0;
  padding:8px 16px;
  border-radius:20px;
  margin:4px 3px;
  font-weight:bold;
  font-size:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.bar button:active{
  transform:scale(.96);
}

.bar .moreBtn{
  background:#f2b705;
  color:#07672f;
  font-size:20px;
  line-height:1;
  padding:5px 15px 9px;
}
.tools,#list{max-width:900px;margin-left:auto;margin-right:auto}
.tools{padding:0 14px 6px;margin-top:-22px;position:relative}
#search,#city{width:100%;padding:14px 16px;border:0;border-radius:14px;font-size:16px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.10);color:#1b2b21}
#search::placeholder{color:#8a958e}
#search:focus,#city:focus{outline:2px solid #f2b705}
#city{margin-top:10px}
.cats{margin-top:12px;overflow-x:auto;white-space:nowrap;padding-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:1.5px solid #0a7d3b;background:#fff;color:#0a7d3b;padding:8px 16px;border-radius:20px;margin:0 3px;font-size:14px;font-weight:600}
.cats button.on{background:#0a7d3b;color:#fff;box-shadow:0 3px 8px rgba(10,125,59,.35)}

#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 12px 30px}
@media(min-width:720px){#list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{background:#fff;margin:0;padding:10px;border-radius:16px;box-shadow:0 3px 12px rgba(10,125,59,.10);border:1px solid #e6eee8;overflow-wrap:anywhere}
.item img{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:12px;margin-bottom:8px;background:#f3f6f4}
.item h3{margin:0 0 4px;font-size:16px;color:#14241a}
.item p{margin:4px 0;font-size:14px;color:#44514a}
.item .place{color:#5f6b64;font-size:13px;margin:4px 0}
.price{display:inline-block;background:#e6f6ec;color:#0a7d3b;font-weight:bold;font-size:14px;padding:3px 12px;border-radius:20px}
a.btn{display:block;width:100%;text-align:center;margin:8px 0 0;background:#25d366;color:#fff;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:14px;box-shadow:0 3px 8px rgba(37,211,102,.35)}
a.map{background:#1a73e8;box-shadow:0 3px 8px rgba(26,115,232,.35)}
.del{display:block;width:100%;margin:8px 0 0;background:#fdecee;color:#b00020;border:1px solid #f3c2c8;padding:10px 12px;border-radius:12px;font-weight:bold;font-size:14px}
.msg{grid-column:1/-1;text-align:center;padding:30px 20px;color:#6b756f;font-size:16px}

#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,30,18,.55);z-index:10;overflow:auto}
.box{background:#fff;margin:40px 14px;padding:20px 16px 16px;border-radius:20px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:500px}
.box input,.box select,.box textarea{width:100%;padding:13px;margin:6px 0;border:1.5px solid #d6ddd8;border-radius:12px;font-size:16px;background:#fff}
.box input:focus,.box select:focus,.box textarea:focus{outline:none;border-color:#0a7d3b}
.box button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,#07672f,#0d9a4a);color:#fff;font-size:16px;font-weight:bold}
.box button.alt{background:#eef2ef;color:#2b3a31}
.box button.x{position:absolute;top:8px;left:8px;width:38px;height:38px;padding:0;margin:0;border-radius:50%;background:#eef2ef;color:#333;font-size:18px}
.note{color:#b00020;margin-top:8px;font-size:14px}

#more{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,30,18,.55);z-index:20}
#moresheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-width:520px;
  max-height:85vh;
  overflow-y:auto;
  margin:0 auto;
  background:linear-gradient(180deg,#ffffff,#f8fbf8);
  border-radius:26px 26px 0 0;
  padding:20px 18px 28px;
  box-shadow:0 -10px 35px rgba(0,0,0,.18);
  border-top:3px solid #d6ad4b;
}
.mh{
  font-weight:900;
  font-size:20px;
  color:#075b35;
  padding:12px 8px 18px;
  text-align:center;
  border-bottom:1px solid #edf1ed;
  margin-bottom:8px;
}

.mrow{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:14px 12px;
  margin:5px 0;
  border:1px solid #edf1ed;
  border-radius:14px;
  background:#fff;
  font-size:15px;
  color:#1b2b21;
  text-align:start;
  transition:background .2s ease,transform .2s ease;
}

.mrow:active{
  background:#edf6ef;
  transform:scale(.98);
}

.mrow span{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:12px;
  background:#edf6ef;
  font-size:21px;
}

.mclose{
  justify-content:center;
  border:0;
  margin-top:14px;
  background:#075b35;
  color:#fff;
  font-weight:800;
}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14241a;color:#fff;padding:10px 20px;border-radius:22px;z-index:30;font-size:14px}
.item{
  background:linear-gradient(160deg,#ffffff,#fbfdfb);
  padding:12px;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(5,47,32,.09);
  border:1px solid #e5ece6;
  transition:transform .25s ease,box-shadow .25s ease;
}

.item:active{
  transform:scale(.98);
  box-shadow:0 3px 10px rgba(5,47,32,.13);
}#search,#city{
  border:1px solid #e5ece6;
  border-radius:16px;
  box-shadow:0 5px 16px rgba(5,47,32,.08);
  transition:all .25s ease;
}

#search:focus,#city:focus{
  outline:none;
  border-color:#d6ad4b;
  box-shadow:0 0 0 3px rgba(214,173,75,.16);
  }.cats button{
  border:1px solid #dce8df;
  background:linear-gradient(145deg,#fff,#f7faf7);
  color:#075b35;
  padding:9px 18px;
  border-radius:25px;
  font-weight:700;
  transition:all .25s ease;
}

.cats button.on{
  background:linear-gradient(135deg,#064d2b,#0a7d3b);
  color:#fff;
  border:1px solid #d6ad4b;
  box-shadow:0 4px 12px rgba(5,77,43,.22);
  transform:translateY(-2px);
}

.cats button:active{
  transform:scale(.95);
}.item img{
  border-radius:16px;
  background:linear-gradient(145deg,#f8faf8,#edf3ee);
  padding:5px;
  transition:transform .3s ease;
}

.item:active img{
  transform:scale(.97);
  }.price{
  background:linear-gradient(135deg,#fff7df,#f8e7b7);
  color:#795512;
  border:1px solid #e8cc83;
  font-weight:800;
  padding:5px 13px;
  border-radius:20px;
  box-shadow:0 2px 7px rgba(150,110,30,.10);
}/* متاجر المرصة */
.stores-section{
  margin:18px 12px 24px;
  padding:16px 14px;
  background:#fff;
  border-radius:16px;
  border:1px solid #e8eee9;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
  direction:rtl;
}
.stores-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}
.stores-heading h2{
  margin:0;
  color:#075b35;
  font-size:18px;
  font-weight:800;
}
.stores-heading p{
  margin:5px 0 0;
  color:#888;
  font-size:12px;
}
.stores-heading button{
  border:0;
  background:#eaf4ee;
  color:#075b35;
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.stores-list{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:3px 2px 10px;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.stores-list::-webkit-scrollbar{
  display:none;
                             }
/* بطاقات المتاجر */
.store-card{
  flex:0 0 145px;
  min-width:145px;
  padding:12px;
  background:linear-gradient(155deg,#fff,#f7faf7);
  border:1px solid #e5ece6;
  border-radius:17px;
  text-align:center;
  box-shadow:0 4px 13px rgba(5,47,32,.08);
  scroll-snap-align:start;
}
.store-card img,
.store-logo{
  width:76px;
  height:76px;
  margin:0 auto 9px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #f0dfb2;
  background:#edf4ee;
}
.store-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}
.store-card h3{
  margin:0;
  color:#075b35;
  font-size:14px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.store-card p{
  margin:5px 0 0;
  color:#7a857e;
  font-size:12px;
}
.all-stores{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:14px;
}
.all-stores .store-card{
  min-width:0;
  width:100%;
}</style>
</head>
<body>

<header>
  <div class="top-header">
    <div class="brand">
      <span class="brand-icon">🛍️</span>
      <h1 id="title"></h1>
    </div>

<div class="header-actions">
  <button class="header-icon" onclick="openSettings()" aria-label="الإعدادات">⚙️</button>
</div>
  </div>

  <div class="bar" id="acct"></div>
</header>
  
<div class="tools">
<input id="search" oninput="render()">
<select id="city" onchange="setCity(this.value)"></select>
<div class="cats" id="cats"></div>
</div>
<section id="storesSection" class="stores-section">
  <div class="stores-heading">
    <div>
      <h2>🏬 متاجر مميزة</h2>
      <p>اكتشف متاجر التجار ومنتجاتهم</p>
    </div>
    <button onclick="showAllStores()">عرض الكل ←</button>
  </div>

  <div id="storesList" class="stores-list">
    <p class="msg">جارٍ تحميل المتاجر...</p>
  </div>
</section><div id="list"></div>
<div id="modal"><div class="box"><button class="x" onclick="closeModal()">✕</button><div id="modalbody"></div></div></div>
<div id="more"><div id="moresheet"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
(function(){
var T={
ar:{
t:'إعدادات المرصة',
s:'مشاركة التطبيق',
w:'مشاركة عبر واتساب',
c:'نسخ رابط التطبيق',
i:'تثبيت التطبيق',
ok:'تم نسخ الرابط',
x:'إغلاق'
},
fr:{
t:'Paramètres de Al Mersa',
s:"Partager l'application",
w:'Partager sur WhatsApp',
c:"Copier le lien de l'application",
i:"Installer l'application",
ok:'Lien copié',
x:'Fermer'
},
en:{
t:'Al Mersa Settings',
s:'Share the app',
w:'Share via WhatsApp',
c:'Copy app link',
i:'Install the app',
ok:'Link copied',
x:'Close'
}
};
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;});
window.addEventListener('appinstalled',function(){dp=null;});
function $(i){return document.getElementById(i);}
function L(){var s=($('title')||{}).textContent||'';if(/[\u0600-\u06FF]/.test(s))return 'ar';if(/march[eé]/i.test(s))return 'fr';return 'en';}
function url(){return location.href.split('#')[0].split('?')[0];}
function ttl(){return ($('title')||{}).textContent||document.title;}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2200);}
function row(f,ic,tx){return '<button class="mrow" onclick="'+f+'"><span>'+ic+'</span>'+tx+'</button>';}

var langOpen=false;

function buildMore(){
var t=T[L()];

var h='<div class="mh">'+t.t+'</div>';

h+=row('toggleLangMenu()','🌐','اللغة ▾');

if(langOpen){
h+=row("setLang('ar');closeMore()","🇲🇷",'العربية');
h+=row("setLang('fr');closeMore()","🇫🇷",'Français');
h+=row("setLang('en');closeMore()","🇬🇧",'English');
}
  h+=row('openNotifications()','🔔','الإشعارات');
  h+=row('openAppearance()','🎨','المظهر');

var app=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;

if(dp&&!app){
h+=row('moreInstall()','📲',t.i);
}

h+=row('moreShare()','🔗',t.s);
h+=row('moreWa()','💬',t.w);
h+=row('moreCopy()','📋',t.c);
h+='<button class="mrow mclose" onclick="closeMore()">'+t.x+'</button>';

$('moresheet').innerHTML=h;
$('more').style.display='block';
}

window.toggleLangMenu=function(){
langOpen=!langOpen;
buildMore();
};
  window.openNotifications=function(){
closeMore();

$('modalbody').innerHTML=
'<div style="text-align:center;padding:15px 5px">'+
'<div style="font-size:42px;margin-bottom:12px">🔔</div>'+
'<h2 style="color:#075b35;margin:0 0 12px">الإشعارات</h2>'+
'<p style="color:#68756d;font-size:15px;line-height:1.9">'+
'ستصلك هنا تنبيهات المرصة المهمة، مثل تحديثات المنتجات والأنشطة الجديدة.'+
'</p>'+
'<div style="background:#edf6ef;padding:14px;border-radius:14px;margin:18px 0;color:#075b35;font-size:14px">'+
'سيتم تفعيل نظام الإشعارات عند اكتمال ربطه بالخلفية.'+
'</div>'+
'<button onclick="closeModal()">حسناً</button>'+
'</div>';

$('modal').style.display='block';
};
  window.openAppearance=function(){
closeMore();

var current=localStorage.getItem('mersa-theme')||'light';

$('modalbody').innerHTML=
'<div style="text-align:center;padding:15px 5px">'+
'<div style="font-size:42px;margin-bottom:12px">🎨</div>'+
'<h2 style="color:#075b35;margin:0 0 18px">مظهر التطبيق</h2>'+

'<button onclick="setAppearance(\'light\')" style="margin-bottom:12px;background:'+(current==='light'?'#075b35':'#eaf3ec')+';color:'+(current==='light'?'#fff':'#075b35')+'">☀️ الوضع الفاتح</button>'+

'<button onclick="setAppearance(\'dark\')" style="background:'+(current==='dark'?'#075b35':'#eaf3ec')+';color:'+(current==='dark'?'#fff':'#075b35')+'">🌙 الوضع الداكن</button>'+

'<button class="alt" onclick="closeModal()">إغلاق</button>'+
'</div>';

$('modal').style.display='block';
};

window.setAppearance=function(mode){
localStorage.setItem('mersa-theme',mode);
document.body.classList.toggle('dark-mode',mode==='dark');
openAppearance();
};

document.body.classList.toggle(
'dark-mode',
localStorage.getItem('mersa-theme')==='dark'
);

window.openMore=function(){
langOpen=false;
buildMore();
};
  window.openSettings=function(){
langOpen=false;
buildMore();
};
  
window.moreWa=function(){
window.open('https://wa.me/?text='+encodeURIComponent(ttl()+' '+url()),'_blank');
closeMore();
};
window.moreCopy=function(){
var u=url(),t=T[L()];
function done(){closeMore();toast(t.ok);}
function fb(){var a=document.createElement('textarea');a.value=u;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);done();}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done,fb);}else{fb();}
};
window.moreInstall=function(){closeMore();if(dp){dp.prompt();dp=null;}};
$('more').addEventListener('click',function(e){if(e.target===this)closeMore();});
})();
</script>
</body>
</html>
